[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vordium"
dynamic = ["version"]
description = "Python SDK for AI agents on Vordium Chain — The AI Layer"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Vordium", email = "dev@vordium.com" }]
keywords = ["vordium", "blockchain", "ai", "agents", "web3", "evm", "crypto", "perps", "clob"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "web3>=6.0.0",
    "eth-account>=0.9.0",
    "requests>=2.28.0",
]

[project.urls]
Homepage = "https://vordium.com"
Documentation = "https://docs.vordium.com"
Repository = "https://github.com/Vordium/vordium-sdk"
Explorer = "https://vordscan.io"

[project.scripts]
vordium = "vordium.cli:main"

[tool.setuptools.dynamic]
# ONE source of truth for the version: vordium/__init__.py __version__.
version = { attr = "vordium.__version__" }

[tool.setuptools.package-data]
# eip712.json is loaded at runtime by vordium/eip712.py — it MUST ship.
vordium = ["*.json"]

[tool.setuptools.packages.find]
include = ["vordium*"]
