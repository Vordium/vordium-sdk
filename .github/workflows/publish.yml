# Publish vordium to PyPI via Trusted Publishing (OIDC) — NO token, NO secrets.
#
# Fires ONLY on a version tag (e.g. `git tag v1.2.0 && git push origin v1.2.0`);
# it does not run on ordinary pushes.
#
# Setup: this repo is registered as a trusted publisher for the `vordium`
# project on PyPI
# (https://pypi.org/manage/project/vordium/settings/publishing/):
#   owner            = Vordium
#   repository       = vordium-sdk
#   workflow         = publish.yml
#   environment      = pypi
# Until that registration exists, the publish job will fail closed (no token
# fallback), which is the intended safe default.
name: publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  test:
    name: test suite (a failing suite cannot publish)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: the tag names the package version
        run: |
          ver=$(python -c 'import re; print(re.search(r"__version__ = \"([^\"]+)\"", open("vordium/__init__.py").read()).group(1))')
          echo "tag ${GITHUB_REF_NAME} · package version ${ver}"
          if [ "${GITHUB_REF_NAME}" != "v${ver}" ]; then echo "::error::the tag ${GITHUB_REF_NAME} does not match the package version ${ver}; nothing is published"; exit 1; fi
      - run: python -m pip install . pytest
      - run: python -m pytest -q tests

  build:
    name: build sdist + wheel
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade build
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: publish to PyPI (OIDC trusted publishing)
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # the ONLY credential — OIDC. No PyPI token, no secrets.
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
